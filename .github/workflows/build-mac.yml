name: Build macOS App

on:
  push:
    branches: [mac]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install pyqt6 yt-dlp pync pyinstaller
      
      - name: Convert iconset to icns
        run: |
          iconutil -c icns assets/icon.iconset -o assets/icon.icns
      
      - name: Build app
        run: |
          pyinstaller build_mac.spec --noconfirm
      
      - name: Create DMG
        run: |
          hdiutil create -volname "VideoDownloader2" -srcfolder dist/VideoDownloader2.app -ov -format UDZO dist/VideoDownloader2.dmg
      
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader2-macOS-app
          path: dist/VideoDownloader2.app
      
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader2-macOS-dmg
          path: dist/VideoDownloader2.dmg
